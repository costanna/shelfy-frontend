<div class="filters">
  <div class="field search-field">
    <label class="visually-hidden" for="filter-search">{{ 'books.search' | translate }}</label>
    <input
      id="filter-search"
      class="input"
      type="search"
      [placeholder]="'books.search' | translate"
      [value]="value().q"
      (input)="onSearch($event)"
    />
  </div>

  <div class="shelf-row" role="group" [attr.aria-label]="'books.filterStatus' | translate">
    <button
      type="button"
      class="shelf-pill"
      [class.is-active]="!value().status"
      (click)="selectStatus(null)"
    >
      {{ 'books.allStatuses' | translate }}
    </button>
    @for (status of statuses; track status) {
      <button
        type="button"
        class="shelf-pill status-{{ status.toLowerCase() }}"
        [class.is-active]="status === value().status"
        [attr.aria-pressed]="status === value().status"
        (click)="selectStatus(status)"
      >
        {{ 'status.' + status | translate }}
        @if (countFor(status); as count) {
          <span class="shelf-pill-count">{{ count }}</span>
        }
      </button>
    }
  </div>

  @if (categories().length > 0) {
    <div class="shelf-row" role="group" [attr.aria-label]="'books.filterCategory' | translate">
      <button
        type="button"
        class="shelf-pill"
        [class.is-active]="!value().categoryId"
        (click)="selectCategory(null)"
      >
        {{ 'books.allCategories' | translate }}
      </button>
      @for (category of categories(); track category.id) {
        <button
          type="button"
          class="shelf-pill"
          [class.is-active]="category.id === value().categoryId"
          [attr.aria-pressed]="category.id === value().categoryId"
          (click)="selectCategory(category.id)"
        >
          {{ category.name }}
        </button>
      }
    </div>
  }

  <div class="bottom-row">
    <div class="field sort-field">
      <label class="visually-hidden" for="filter-sort">{{ 'books.sortBy' | translate }}</label>
      <select id="filter-sort" class="select" (change)="onSort($event)">
        @for (option of sortOptions; track option) {
          <option [value]="option" [selected]="option === (value().sort || defaultSort)">
            {{ 'books.sort.' + option | translate }}
          </option>
        }
      </select>
    </div>

    @if (hasActiveFilters()) {
      <button type="button" class="btn btn-ghost clear-button" (click)="clear()">
        {{ 'books.clearFilters' | translate }}
      </button>
    }
  </div>

  <app-filter-presets [current]="value()" (apply)="valueChange.emit($event)" />
</div>
