<div class="filters">
  <div class="field search-field">
    <label class="visually-hidden" for="filter-search">{{ 'books.search' | translate }}</label>
    <input
      id="filter-search"
      class="input"
      type="search"
      [placeholder]="'books.search' | translate"
      [value]="value().q"
      (input)="onSearch($event)"
    />
  </div>

  <div class="field">
    <label class="visually-hidden" for="filter-status">{{ 'books.filterStatus' | translate }}</label>
    <select id="filter-status" class="select" (change)="onStatus($event)">
      <option value="" [selected]="!value().status">{{ 'books.allStatuses' | translate }}</option>
      @for (status of statuses; track status) {
        <option [value]="status" [selected]="status === value().status">
          {{ 'status.' + status | translate }}
        </option>
      }
    </select>
  </div>

  <div class="field">
    <label class="visually-hidden" for="filter-category">
      {{ 'books.filterCategory' | translate }}
    </label>
    <select id="filter-category" class="select" (change)="onCategory($event)">
      <option value="" [selected]="!value().categoryId">{{ 'books.allCategories' | translate }}</option>
      @for (category of categories(); track category.id) {
        <option [value]="category.id" [selected]="category.id === value().categoryId">
          {{ category.name }}
        </option>
      }
    </select>
  </div>

  <div class="field">
    <label class="visually-hidden" for="filter-sort">{{ 'books.sortBy' | translate }}</label>
    <select id="filter-sort" class="select" (change)="onSort($event)">
      @for (option of sortOptions; track option) {
        <option [value]="option" [selected]="option === (value().sort || defaultSort)">
          {{ 'books.sort.' + option | translate }}
        </option>
      }
    </select>
  </div>

  @if (hasActiveFilters()) {
    <button type="button" class="btn btn-ghost clear-button" (click)="clear()">
      {{ 'books.clearFilters' | translate }}
    </button>
  }
</div>
