<a class="book-card" [routerLink]="['/books', book().id]">
  <div class="cover">
    @if (book().coverUrl) {
      <img [src]="book().coverUrl" [alt]="book().title" loading="lazy" />
    } @else {
      <span class="cover-fallback" aria-hidden="true">{{ initials(book().title) }}</span>
    }
    <app-status-badge class="cover-badge" [status]="book().status" />
  </div>

  <div class="info">
    <h3 class="title">{{ book().title }}</h3>
    <p class="author">{{ book().author || ('books.noAuthor' | translate) }}</p>

    @if (book().categories.length) {
      <ul class="categories">
        @for (category of book().categories; track category.id) {
          <li class="chip">{{ category.name }}</li>
        }
      </ul>
    }
  </div>
</a>
