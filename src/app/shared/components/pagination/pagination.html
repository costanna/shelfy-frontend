@if (totalPages() > 1) {
  <nav class="pagination">
    <button type="button" class="btn btn-secondary" [disabled]="isFirst()" (click)="go(-1)">
      {{ 'books.previous' | translate }}
    </button>

    <span class="pagination-status">{{ 'books.pageOf' | translate: label() }}</span>

    <button type="button" class="btn btn-secondary" [disabled]="isLast()" (click)="go(1)">
      {{ 'books.next' | translate }}
    </button>
  </nav>
}
