@if (editable()) {
  <div
    class="stars stars-editable"
    role="slider"
    tabindex="0"
    aria-valuemin="0.5"
    aria-valuemax="5"
    [attr.aria-valuenow]="rating()"
    [attr.aria-label]="'reviews.rating' | translate"
    (keydown)="onKeydown($event)"
    (mouseleave)="onLeave()"
  >
    @for (star of stars; track star) {
      <button
        type="button"
        class="star"
        [style.--fill.%]="fillPercent(star)"
        [attr.aria-label]="'reviews.starsOf' | translate: { rating: star }"
        (click)="onClick(star, $event)"
        (mousemove)="onHover(star, $event)"
      >
        <span class="star-bg" aria-hidden="true">★</span>
        <span class="star-fg" aria-hidden="true">★</span>
      </button>
    }
  </div>
} @else {
  <div class="stars" [attr.aria-label]="'reviews.starsOf' | translate: label()">
    @for (star of stars; track star) {
      <span class="star" aria-hidden="true" [style.--fill.%]="fillPercent(star)">
        <span class="star-bg">★</span>
        <span class="star-fg">★</span>
      </span>
    }
  </div>
}
