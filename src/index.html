<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shelfy</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5a4fcf">
  <meta name="description" content="Organiza los libros que lees, los que te faltan y los que quieres comprar.">
  <!-- iOS no sigue el manifest.webmanifest para "Añadir a pantalla de inicio" (o lo hace de
       forma poco fiable según la versión): sin estas etiquetas, el acceso directo abre Safari
       con la barra de direcciones visible en vez de pantalla completa como una app. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Shelfy">
  <!-- Equivalente estándar (no-Apple) de la etiqueta anterior; algunos
       navegadores basados en Chromium ya avisan de que la de Apple por sí
       sola está obsoleta. Se dejan las dos: iOS/Safari antiguos solo
       entienden la de Apple. -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Precalienta la conexión a las APIs externas de búsqueda de libros (Google
       Books, Open Library, BNE), para que la primera búsqueda en el formulario
       de "añadir libro" no pague el coste de la conexión TLS en ese momento. -->
  <link rel="preconnect" href="https://www.googleapis.com">
  <link rel="preconnect" href="https://openlibrary.org">
  <link rel="preconnect" href="https://covers.openlibrary.org">
  <link rel="preconnect" href="https://catalogo.bne.es">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <app-root></app-root>
</body>
</html>
