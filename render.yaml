# Blueprint de Render para shelfy-frontend.
#
# Uso: Render dashboard → New → Blueprint → conecta este repositorio.
#
# El apiUrl del backend se resuelve en build time desde
# src/environments/environment.prod.ts, no desde una variable de entorno:
# actualiza ese fichero (y CORS_ALLOWED_ORIGINS en el backend) antes de
# desplegar o de que cambie la URL del Web Service del backend.
services:
  - type: web
    name: shelfy-frontend
    runtime: static
    plan: free
    buildCommand: npm run build
    staticPublishPath: dist/shelfy-frontend/browser
    routes:
      # SPA de Angular: cualquier ruta que no sea un fichero real cae en index.html.
      - type: rewrite
        source: /*
        destination: /index.html
